name: Auto Score Race

on:
  schedule:
    - cron: '0 14 * * 1'  # Every Monday 14:00 UTC (after the 12:00 UTC publication window)
    - cron: '0 14 * * 4'  # Every Thursday 14:00 UTC (catch late steward decisions)
  workflow_dispatch:       # Allow manual trigger from GitHub UI

concurrency:
  group: season-data-writes
  cancel-in-progress: false

# Up to three attempts, each in its own job and so on its own runner. See
# auto-score-attempt.yml for why a fresh runner, not an in-job retry, is what
# gets past the FIA bot filter. Nothing to score is a success on the first
# attempt, so the retries only run when there was real work and it failed.
jobs:
  first:
    permissions:
      contents: write
    uses: ./.github/workflows/auto-score-attempt.yml
    with:
      wait_seconds: 0
      final: false

  second:
    needs: first
    if: needs.first.outputs.outcome == 'failure'
    permissions:
      contents: write
    uses: ./.github/workflows/auto-score-attempt.yml
    with:
      wait_seconds: 600
      final: false

  third:
    needs: second
    if: needs.second.outputs.outcome == 'failure'
    permissions:
      contents: write
    uses: ./.github/workflows/auto-score-attempt.yml
    with:
      wait_seconds: 1800
      final: true
